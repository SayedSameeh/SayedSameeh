<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Sameeh OS desktop</title>
  <desc id="desc">A retro desktop welcome screen inspired by classic 98 and XP interfaces, featuring vision, voice, and local AI projects.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#65b8f0"/><stop offset="1" stop-color="#c8ecff"/></linearGradient>
    <linearGradient id="titlebar" x2="0" y2="1"><stop stop-color="#2588e9"/><stop offset="1" stop-color="#0755b5"/></linearGradient>
    <linearGradient id="taskbar" x2="0" y2="1"><stop stop-color="#4b99ec"/><stop offset=".18" stop-color="#176bd2"/><stop offset="1" stop-color="#0752b5"/></linearGradient>
    <linearGradient id="start" x2="0" y2="1"><stop stop-color="#7bbb52"/><stop offset=".5" stop-color="#3b8c25"/><stop offset="1" stop-color="#176c18"/></linearGradient>
    <linearGradient id="silver" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d9d9d9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#00345e" flood-opacity=".3"/></filter>
