    <g transform="translate(964 67)"><rect width="24" height="19" rx="3" fill="#77baf4" stroke="#fff"/><path d="M6 9h12" stroke="#fff" stroke-width="2"/><rect x="994" width="24" height="19" rx="3" fill="#77baf4" stroke="#fff"/><path d="m1001 5 10 10m0-10-10 10" stroke="#fff" stroke-width="2"/></g>
    <rect x="166" y="102" width="868" height="31" fill="url(#silver)"/>
