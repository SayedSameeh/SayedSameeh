  <path d="M0 320 Q200 248 420 306 T820 298 T1200 280 V400 H0Z" fill="#3d963b"/>
  <g opacity=".85" fill="#fff"><ellipse cx="165" cy="87" rx="61" ry="19"/><ellipse cx="199" cy="78" rx="36" ry="26"/><ellipse cx="231" cy="90" rx="51" ry="17"/><ellipse cx="1010" cy="85" rx="62" ry="19"/><ellipse cx="1047" cy="75" rx="37" ry="26"/><ellipse cx="1082" cy="88" rx="52" ry="17"/></g>
  <g filter="url(#shadow)">
