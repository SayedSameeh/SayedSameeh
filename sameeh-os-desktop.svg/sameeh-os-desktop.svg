    <text x="202" y="177" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#164b85">Welcome to my desktop</text>
    <text x="202" y="207" font-family="Arial, sans-serif" font-size="20" fill="#34495e">I build tools that see, listen, and respond.</text>
