      <g transform="translate(415 226)"><rect width="50" height="42" rx="8" fill="#e4f2ff" stroke="#a9c8e7"/><text x="25" y="29" font-size="26">🎙️</text><text x="25" y="62" font-size="15" fill="#24384a">Voice</text></g>
      <g transform="translate(575 226)"><rect width="50" height="42" rx="8" fill="#e4f2ff" stroke="#a9c8e7"/><text x="25" y="29" font-size="26">🤖</text><text x="25" y="62" font-size="15" fill="#24384a">Local AI</text></g>
