<svg xmlns="http://www.w3.org/2000/svg" width="900" height="516" viewBox="0 0 900 516" role="img" aria-labelledby="title desc">
  <title id="title">Sameeh OS Project Explorer</title>
  <desc id="desc">A classic Windows XP desktop window showing four projects: Vision Lab, Voice Studio, Local AI, and Web Browser.</desc>
  <defs>
    <linearGradient id="xpbar" x2="0" y2="1"><stop offset="0" stop-color="#6db8f5"/><stop offset=".42" stop-color="#1683df"/><stop offset="1" stop-color="#0754ad"/></linearGradient>
    <linearGradient id="outerbar" x2="0" y2="1"><stop offset="0" stop-color="#8fc8f7"/><stop offset=".35" stop-color="#318dde"/><stop offset="1" stop-color="#0753a8"/></linearGradient>
    <linearGradient id="taskbar" x2="0" y2="1"><stop offset="0" stop-color="#3c9c22"/><stop offset=".45" stop-color="#268515"/><stop offset="1" stop-color="#17690c"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="controls"><rect x="0" y="0" width="20" height="17" rx="2" fill="#2b8de0" stroke="#b9e0ff"/><path d="M5 12h10" stroke="#fff" stroke-width="2"/><rect x="23" y="0" width="20" height="17" rx="2" fill="#2b8de0" stroke="#b9e0ff"/><rect x="29" y="4" width="8" height="7" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="46" y="0" width="23" height="17" rx="2" fill="#e64d42" stroke="#ffd4c9"/><path d="m53 4 9 9m0-9-9 9" stroke="#fff" stroke-width="1.8"/></g>
    <g id="folder"><path d="M2 5h14l3 3h19v20H2z" fill="#ffd45e" stroke="#aa7110" stroke-width="1.5"/><path d="M2 11h36l-4 17H2z" fill="#f5ae22" stroke="#aa7110" stroke-width="1.3"/><path d="M4 13h31" stroke="#ffe9a5" stroke-width="2"/></g>
    <g id="window"><rect width="416" height="194" rx="5" fill="#ece9d8" stroke="#fff" stroke-width="2"/><rect x="2" y="2" width="412" height="27" rx="4" fill="url(#xpbar)"/><path d="M3 27h410" stroke="#064887" stroke-width="2"/><rect x="9" y="7" width="14" height="14" rx="2" fill="#f7f7f7" stroke="#174e94"/><path d="M12 10h8M12 13h8M12 16h5" stroke="#138bce" stroke-width="1.3"/><rect x="7" y="36" width="402" height="149" fill="#fff" stroke="#aca899"/><path d="M9 38h398M9 38v145" stroke="#fff" stroke-width="2"/><path d="M8 184h400M408 38v146" stroke="#888" stroke-width="2"/></g>
