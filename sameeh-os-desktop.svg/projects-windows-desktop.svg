  <rect x="8" y="8" width="884" height="500" rx="9" fill="#9b9a91" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="12" y="12" width="876" height="38" rx="7" fill="url(#outerbar)"/><path d="M14 47h872" stroke="#0753a8" stroke-width="3"/>
  <g transform="translate(22 21) scale(.72)"><use href="#folder"/></g>
  <text x="56" y="38" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="19" font-weight="bold">Sameeh OS — Project Explorer</text>
  <g transform="translate(798 21)"><use href="#controls"/></g>
  <rect x="14" y="53" width="872" height="26" fill="#ece9d8" stroke="#fff"/><text x="25" y="71" fill="#222" font-family="Tahoma,Arial,sans-serif" font-size="14">File　 Edit　 View　 Favorites　 Tools　 Help</text>
  <rect x="14" y="80" width="872" height="416" fill="#d7e7f5" stroke="#888"/>
  <g transform="translate(24 92)"><use href="#window"/><text x="40" y="20" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="15" font-weight="bold">Vision Lab — GCDA</text><g transform="translate(333 7) scale(.82)"><use href="#controls"/></g><g transform="translate(22 66) scale(1.05)"><use href="#folder"/></g><text x="76" y="70" fill="#173d6b" font-family="Tahoma,Arial,sans-serif" font-size="19" font-weight="bold">👁️ Vision Lab</text><text x="76" y="94" fill="#555" font-family="Tahoma,Arial,sans-serif" font-size="14">Python · computer vision</text><text x="22" y="130" fill="#222" font-family="Tahoma,Arial,sans-serif" font-size="14">Hands-free desktop control through real-time hand gestures.</text><rect x="22" y="151" width="112" height="23" rx="2" fill="#e5e3dc" stroke="#777"/><path d="M24 153h108M24 153v19" stroke="#fff" stroke-width="2"/><text x="34" y="167" fill="#0645ad" font-family="Tahoma,Arial,sans-serif" font-size="13" text-decoration="underline">OPEN PROJECT ↗</text></g>
  <g transform="translate(460 92)"><use href="#window"/><text x="40" y="20" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="15" font-weight="bold">Voice Studio — STTTS Translator</text><g transform="translate(333 7) scale(.82)"><use href="#controls"/></g><g transform="translate(22 66) scale(1.05)"><use href="#folder"/></g><text x="76" y="70" fill="#173d6b" font-family="Tahoma,Arial,sans-serif" font-size="19" font-weight="bold">🎙️ Voice Studio</text><text x="76" y="94" fill="#555" font-family="Tahoma,Arial,sans-serif" font-size="14">Python · speech interfaces</text><text x="22" y="130" fill="#222" font-family="Tahoma,Arial,sans-serif" font-size="14">Hindi–Marathi translation with local transcription and XTTS.</text><rect x="22" y="151" width="112" height="23" rx="2" fill="#e5e3dc" stroke="#777"/><path d="M24 153h108M24 153v19" stroke="#fff" stroke-width="2"/><text x="34" y="167" fill="#0645ad" font-family="Tahoma,Arial,sans-serif" font-size="13" text-decoration="underline">OPEN PROJECT ↗</text></g>
  <g transform="translate(24 296)"><use href="#window"/><text x="40" y="20" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="15" font-weight="bold">Local AI — WhatsApp AI Autoresponder</text><g transform="translate(333 7) scale(.82)"><use href="#controls"/></g><g transform="translate(22 66) scale(1.05)"><use href="#folder"/></g><text x="76" y="70" fill="#173d6b" font-family="Tahoma,Arial,sans-serif" font-size="19" font-weight="bold">🤖 Local AI</text><text x="76" y="94" fill="#555" font-family="Tahoma,Arial,sans-serif" font-size="14">JavaScript · Node.js · Ollama</text><text x="22" y="130" fill="#222" font-family="Tahoma,Arial,sans-serif" font-size="14">A WhatsApp assistant powered by local language models.</text><rect x="22" y="151" width="112" height="23" rx="2" fill="#e5e3dc" stroke="#777"/><path d="M24 153h108M24 153v19" stroke="#fff" stroke-width="2"/><text x="34" y="167" fill="#0645ad" font-family="Tahoma,Arial,sans-serif" font-size="13" text-decoration="underline">OPEN PROJECT ↗</text></g>
  <g transform="translate(460 296)"><use href="#window"/><text x="40" y="20" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="15" font-weight="bold">Web Browser — My Portfolio</text><g transform="translate(333 7) scale(.82)"><use href="#controls"/></g><g transform="translate(22 66) scale(1.05)"><use href="#folder"/></g><text x="76" y="70" fill="#173d6b" font-family="Tahoma,Arial,sans-serif" font-size="19" font-weight="bold">🌐 Web Browser</text><text x="76" y="94" fill="#555" font-family="Tahoma,Arial,sans-serif" font-size="14">JavaScript · personal site</text><text x="22" y="130" fill="#222" font-family="Tahoma,Arial,sans-serif" font-size="14">A little corner of the web for my work and projects.</text><rect x="22" y="151" width="112" height="23" rx="2" fill="#e5e3dc" stroke="#777"/><path d="M24 153h108M24 153v19" stroke="#fff" stroke-width="2"/><text x="34" y="167" fill="#0645ad" font-family="Tahoma,Arial,sans-serif" font-size="13" text-decoration="underline">OPEN PROJECT ↗</text></g>
  <rect x="14" y="479" width="872" height="17" fill="url(#taskbar)"/><path d="M15 480h870" stroke="#9ed18e"/><text x="26" y="493" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="12" font-weight="bold">🟩 Start</text><text x="740" y="493" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="11">4 shortcuts　 ☁️</text>
